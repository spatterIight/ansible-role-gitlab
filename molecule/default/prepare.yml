---
- name: Prepare GitLab Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for GitLab Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for GitLab Molecule tests preparation
      ansible.builtin.package:
        name:
          # Used by the `ansible.builtin.uri` calls in verify.yml
          - python3-requests
          # The storage driver Docker is configured with below. `overlay2` cannot be nested inside
          # the container Molecule runs these tests in, and `vfs` (the usual fallback) has no
          # copy-on-write, so it writes out every layer of the image in full. GitLab's image
          # unpacks to ~5.5 GB, which makes that difference expensive.
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed for GitLab Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        # A registry mirror can be specified via the `MOLECULE_DOCKER_REGISTRY_MIRROR` environment variable
        # (e.g. `https://mirror.gcr.io`), which helps when Docker Hub rate-limits pulling the GitLab image.
        docker_daemon_options: >-
          {{
            {'storage-driver': 'fuse-overlayfs'}
            | combine({'registry-mirrors': [lookup('ansible.builtin.env', 'MOLECULE_DOCKER_REGISTRY_MIRROR')]} if lookup('ansible.builtin.env', 'MOLECULE_DOCKER_REGISTRY_MIRROR') else {})
          }}

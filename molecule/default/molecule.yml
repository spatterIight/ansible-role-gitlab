---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: gitlab-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    # Also what gives the inner Docker a /dev/fuse to hand to fuse-overlayfs.
    # See prepare.yml for why that storage driver is not the fleet's usual vfs.
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        gitlab_debug_service_enabled: false
        gitlab_restarts_check_enabled: true

        # Variables for GitLab
        gitlab_uid: 1000
        gitlab_gid: 1000
        gitlab_scheme: http
        gitlab_hostname: localhost
        gitlab_container_labels_traefik_enabled: false
        gitlab_container_http_host_bind_port: 8080
        gitlab_container_ssh_host_bind_port: 2222
        gitlab_config_initial_root_password: Molecule-Test-Pass-9471

        # This scenario relies on the role's defaults, which use the database and Redis servers
        # bundled in the GitLab container image.
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible

---
# The role is not included in this playbook, so its defaults are read directly
# (e.g. for the version the role pins).
- name: Load the role defaults
  ansible.builtin.include_vars:
    file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    name: gitlab_defaults

- name: Wait for the GitLab systemd services to become active (up to 180s each)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  register: gitlab_services
  until: gitlab_services.status.ActiveState == 'active'
  retries: 36
  delay: 5
  loop: "{{ gitlab_verify_units }}"
  # So that giving up is reported by the assertion below rather than as a
  # wall of systemd unit properties.
  failed_when: false

# The unit is `Restart=always`, so even a crash-looping container reads as active here.
# This is a precondition, not a result.
- name: Assert the GitLab systemd services are active
  ansible.builtin.assert:
    that: gitlab_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
    fail_msg: >-
      Not every service is active:
      {{ dict(gitlab_verify_units | zip(gitlab_services.results | map(attribute='status.ActiveState'))) }}
    success_msg: "Every systemd service is active"

- name: Retrieve the GitLab systemd services log for debugging
  when: gitlab_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
  changed_when: false
  loop: "{{ gitlab_verify_units }}"

# On its first start, GitLab reconfigures itself and sets up its database before its web services come up.
# This loop separates "still booting" from "never coming up".
- name: Wait for the GitLab sign-in page to respond (up to 20m)
  ansible.builtin.uri:
    url: "{{ gitlab_verify_base_url }}/users/sign_in"
    method: GET
    follow_redirects: none
    status_code: [200, 301, 302, 404, 500, 502, 503]
    return_content: true
  register: gitlab_sign_in_page
  until: gitlab_sign_in_page.status == 200
  retries: 240
  delay: 5
  failed_when: false

- name: Assert that the GitLab sign-in page responds
  ansible.builtin.assert:
    that: gitlab_sign_in_page.status == 200
    fail_msg: "GitLab did not serve its sign-in page (got {{ gitlab_sign_in_page.status | default('no response') }})"
    success_msg: "GitLab serves its sign-in page"

# The sign-in page can respond while `gitlab-ctl reconfigure` still runs, whose last steps (restarting services)
# can drop the requests below. So wait until no reconfigure (a `cinc-client` process) runs in the container.
# `! pgrep` only succeeds if the container runs without such a process.
# (The `[t]` keeps the pattern from matching the `sh` running it.)
- name: Wait for GitLab to finish reconfiguring itself (up to 10m)
  ansible.builtin.command:
    cmd: docker exec gitlab sh -c '! pgrep -f "cinc-clien[t]"'
  register: gitlab_reconfigure_done
  until: gitlab_reconfigure_done.rc == 0
  retries: 120
  delay: 5
  changed_when: false
  failed_when: false

- name: Assert that GitLab finished reconfiguring itself
  ansible.builtin.assert:
    that: gitlab_reconfigure_done.rc == 0
    fail_msg: "GitLab was still reconfiguring itself after 10 minutes (or its container is not running)"
    success_msg: "GitLab finished reconfiguring itself"

# Services restarted at the end of the reconfigure take a moment to respond again.
- name: Wait for the GitLab sign-in page to respond after reconfiguring (up to 5m)
  ansible.builtin.uri:
    url: "{{ gitlab_verify_base_url }}/users/sign_in"
    method: GET
    follow_redirects: none
    status_code: [200, 301, 302, 404, 500, 502, 503]
  register: gitlab_sign_in_page
  until: gitlab_sign_in_page.status == 200
  retries: 60
  delay: 5
  failed_when: false

- name: Assert that the GitLab sign-in page responds after reconfiguring
  ansible.builtin.assert:
    that: gitlab_sign_in_page.status == 200
    fail_msg: "GitLab did not serve its sign-in page after reconfiguring (got {{ gitlab_sign_in_page.status | default('no response') }})"
    success_msg: "GitLab serves its sign-in page after reconfiguring"

# A negative control for the checks that follow. If the API were reachable without
# signing in, "signed in successfully" and "reported this version" would prove nothing.
- name: Request the GitLab API without signing in
  ansible.builtin.uri:
    url: "{{ gitlab_verify_base_url }}/api/v4/version"
    method: GET
    status_code: [200, 401, 403]
  register: gitlab_version_anonymous
  failed_when: false

- name: Assert that the GitLab API rejects unauthenticated requests
  ansible.builtin.assert:
    that: gitlab_version_anonymous.status == 401
    fail_msg: >-
      The GitLab API answered an unauthenticated request with
      {{ gitlab_version_anonymous.status | default('no response') }};
      the authenticated checks below would then be meaningless
    success_msg: "The GitLab API rejects unauthenticated requests"

# Signing in uses the web form, as GitLab no longer allows exchanging a password for an API token by default.
# The form is protected against CSRF, so each attempt needs the token and session cookie of a fresh sign-in page.
- name: Sign in to GitLab with a wrong password
  ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks_sign_in.yml"
  vars:
    gitlab_verify_sign_in_password: definitely-not-the-configured-password
    gitlab_verify_sign_in_result_var: gitlab_sign_in_wrong

# A second negative control: the credentials check below must be able to fail.
# A rejected sign-in re-renders the form (200), while a successful one redirects (302).
- name: Assert that GitLab rejects a wrong password
  ansible.builtin.assert:
    that: gitlab_sign_in_wrong.status == 200
    fail_msg: >-
      GitLab did not reject a wrong password
      (status {{ gitlab_sign_in_wrong.status | default('no response') }});
      the credentials check below cannot fail and is worthless
    success_msg: "GitLab rejects a wrong password"

# The `root` user only has this password if GitLab runs on the role's `gitlab.rb`.
# Otherwise, GitLab generates a random one.
- name: Sign in to GitLab with the configured credentials
  ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks_sign_in.yml"
  vars:
    gitlab_verify_sign_in_password: "{{ gitlab_config_initial_root_password }}"
    gitlab_verify_sign_in_result_var: gitlab_sign_in

- name: Assert that the configured GitLab credentials work
  ansible.builtin.assert:
    that:
      - gitlab_sign_in.status == 302
      - gitlab_sign_in.session | length > 0
    fail_msg: >-
      GitLab did not accept the credentials the role configured
      (status {{ gitlab_sign_in.status | default('no response') }}), so
      gitlab_config_initial_root_password did not reach GitLab
    success_msg: "GitLab accepts the credentials the role configured"

- name: Query the version of the running GitLab
  ansible.builtin.uri:
    url: "{{ gitlab_verify_base_url }}/api/v4/version"
    method: GET
    headers:
      Cookie: "_gitlab_session={{ gitlab_sign_in.session }}"
    status_code: [200, 401, 403]
  register: gitlab_version
  failed_when: false

- name: Assert the running GitLab is the version and edition this role installs
  ansible.builtin.assert:
    that:
      - gitlab_version.status == 200
      - gitlab_version.json.version == gitlab_defaults.gitlab_version | string
      - gitlab_version.json.enterprise == (gitlab_edition | default(gitlab_defaults.gitlab_edition) == 'ee')
    fail_msg: >-
      GitLab reports {{ gitlab_version.json.version | default('none') }} (enterprise: {{ gitlab_version.json.enterprise | default('unknown') }}),
      expected {{ gitlab_defaults.gitlab_version }} ({{ gitlab_edition | default(gitlab_defaults.gitlab_edition) }})
    success_msg: "GitLab reports {{ gitlab_version.json.version }}"

# The SSH server inside the container only runs if its port is published, which differs between scenarios.
- name: Determine whether the GitLab SSH server is expected to run
  ansible.builtin.set_fact:
    gitlab_verify_ssh_expected: "{{ gitlab_container_ssh_host_bind_port | default('') | string | length > 0 }}"

- name: Retrieve the services running inside the GitLab container
  ansible.builtin.command:
    cmd: docker exec gitlab gitlab-ctl status
  register: gitlab_ctl_status
  changed_when: false
  # `gitlab-ctl status` exits non-zero when any service it knows about is down,
  # which is what the assertions below are about.
  failed_when: false

# Which of these run depends on `gitlab.rb`, so this proves that the database and Redis settings reached GitLab.
- name: Assert that the bundled database and Redis servers run only when they are supposed to
  ansible.builtin.assert:
    that:
      - "('run: postgresql:' in gitlab_ctl_status.stdout) == (gitlab_database_type | default(gitlab_defaults.gitlab_database_type) == 'bundled')"
      - "('run: redis:' in gitlab_ctl_status.stdout) == (not gitlab_verify_external_redis_expected)"
      - "'run: puma:' in gitlab_ctl_status.stdout"
      - "'run: sidekiq:' in gitlab_ctl_status.stdout"
      - "'run: gitaly:' in gitlab_ctl_status.stdout"
      - "('run: sshd:' in gitlab_ctl_status.stdout) == (gitlab_verify_ssh_expected | bool)"
      - "'down:' not in gitlab_ctl_status.stdout"
    fail_msg: "Unexpected set of services inside the GitLab container: {{ gitlab_ctl_status.stdout_lines }}"
    success_msg: "The expected set of services runs inside the GitLab container"

# Git over SSH is served by an OpenSSH server inside the container, published on
# `gitlab_container_ssh_host_bind_port`.
- name: Wait for the GitLab SSH server to greet on the published port
  when: gitlab_verify_ssh_expected | bool
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ gitlab_container_ssh_host_bind_port }}"
    search_regex: OpenSSH
    timeout: 30

- name: Verify the container registry
  when: gitlab_registry_enabled | default(false) | bool
  block:
    # The registry answers its API root with 401 and this header when it's up but not signed in to.
    - name: Request the container registry API
      ansible.builtin.uri:
        url: "http://localhost:{{ gitlab_container_registry_http_host_bind_port }}/v2/"
        method: GET
        status_code: [200, 401, 404, 502, 503]
      register: gitlab_registry
      until: gitlab_registry.status == 401
      retries: 12
      delay: 5
      failed_when: false

    - name: Assert that the container registry responds
      ansible.builtin.assert:
        that:
          - gitlab_registry.status == 401
          - gitlab_registry.docker_distribution_api_version | default('') == 'registry/2.0'
        fail_msg: "The container registry did not respond as expected ({{ gitlab_registry.status | default('no response') }})"
        success_msg: "The container registry responds"

# `gitlab-backup` uses the bundled `pg_dump` client, which cannot dump a server of a newer major version.
# With an external database, this proves that `gitlab_database_postgres_version` selects a matching client.
- name: Create a GitLab backup
  ansible.builtin.command:
    cmd: docker exec gitlab gitlab-backup create
  register: gitlab_backup
  changed_when: false
  failed_when: false

- name: Find the GitLab backup
  ansible.builtin.find:
    paths: /gitlab/data/backups
    patterns: "*_gitlab_backup.tar"
  register: gitlab_backup_files

- name: Assert that GitLab created a backup
  ansible.builtin.assert:
    that:
      - gitlab_backup.rc == 0
      - gitlab_backup_files.matched > 0
    fail_msg: >-
      gitlab-backup exited with {{ gitlab_backup.rc }} and {{ gitlab_backup_files.matched }} backup(s) were found:
      {{ (gitlab_backup.stdout_lines + gitlab_backup.stderr_lines)[-30:] }}
    success_msg: "GitLab created a backup"

# tasks/install.yml runs this command before an upgrade, and parses its output (which needs a `Database: main` line).
# This makes sure that the command still works and prints what the role looks for.
- name: Retrieve the status of GitLab's batched background migrations
  ansible.builtin.command:
    cmd: docker exec gitlab /opt/gitlab/bin/gitlab-rake gitlab:background_migrations:status
  register: gitlab_background_migrations_status
  changed_when: false
  failed_when: false

- name: Assert that the status of GitLab's batched background migrations is in the format the role parses
  ansible.builtin.assert:
    that:
      - gitlab_background_migrations_status.rc == 0
      - "'Database: main' in gitlab_background_migrations_status.stdout_lines"
    fail_msg: >-
      `gitlab-rake gitlab:background_migrations:status` exited with {{ gitlab_background_migrations_status.rc }}
      or printed something the role does not understand:
      {{ (gitlab_background_migrations_status.stdout_lines + gitlab_background_migrations_status.stderr_lines)[-30:] }}
    success_msg: "The status of GitLab's batched background migrations is in the format the role parses"

# ansible-role-postgres runs the scenario's `additional_sql_queries` as its superuser.
- name: Verify the extension GitLab requires which only a superuser may create
  when: gitlab_database_type | default(gitlab_defaults.gitlab_database_type) == 'postgres'
  block:
    - name: Query the Postgres extensions in the GitLab database
      ansible.builtin.command:
        cmd: >-
          /postgres/bin/cli-non-interactive -d {{ gitlab_database_name }} -tAc
          "SELECT extname FROM pg_extension WHERE extname = 'amcheck'"
      register: gitlab_postgres_amcheck
      changed_when: false
      failed_when: false

    - name: Assert that the amcheck extension exists in the GitLab database
      ansible.builtin.assert:
        that: "'amcheck' in gitlab_postgres_amcheck.stdout_lines"
        fail_msg: "The amcheck extension does not exist in the GitLab database: {{ gitlab_postgres_amcheck.stdout_lines + gitlab_postgres_amcheck.stderr_lines }}"
        success_msg: "The amcheck extension exists in the GitLab database"

# The scenario leaves `gitlab_identifier` at its default, so the base path is /gitlab.
- name: Read the container label file
  ansible.builtin.slurp:
    src: /gitlab/labels
  register: gitlab_labels

# Traefik is disabled in this scenario, so no Traefik label may be emitted.
- name: Assert that no Traefik labels are emitted while Traefik is disabled
  ansible.builtin.assert:
    that: "'traefik' not in (gitlab_labels.content | b64decode)"
    fail_msg: "Traefik labels are emitted even though gitlab_container_labels_traefik_enabled is false"
    success_msg: "No Traefik labels are emitted while Traefik is disabled"

# The configuration file contains the database password, so nobody but root may read it.
- name: Check the GitLab configuration file
  ansible.builtin.stat:
    path: /gitlab/config/gitlab.rb
  register: gitlab_config_file

- name: Assert that the GitLab configuration file is only readable by root
  ansible.builtin.assert:
    that:
      - gitlab_config_file.stat.exists
      - gitlab_config_file.stat.pw_name == 'root'
      - gitlab_config_file.stat.mode == '0600'
    fail_msg: "/gitlab/config/gitlab.rb is {{ gitlab_config_file.stat.pw_name | default('?') }}:{{ gitlab_config_file.stat.mode | default('?') }}, expected root:0600"
    success_msg: "/gitlab/config/gitlab.rb is only readable by root"

- name: Verify nothing was quietly restarting while all of that was being checked
  when: "gitlab_restarts_check_enabled | bool"
  block:
    # `Restart=always` means the unit reads `active` while crash-looping,
    # so this watches it with everything already answering.
    - name: Sample the restart counters
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: gitlab_restarts_before
      loop: "{{ gitlab_verify_units }}"

    # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
    # tick at least once inside the window.
    - name: Watch the services for 45 seconds
      ansible.builtin.pause:
        seconds: 45

    - name: Sample the restart counters again
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: gitlab_restarts_after
      loop: "{{ gitlab_verify_units }}"

    - name: Assert no service restarted while it was up
      ansible.builtin.assert:
        that:
          - gitlab_restarts_after.results | map(attribute='status.NRestarts') | list == gitlab_restarts_before.results | map(attribute='status.NRestarts') | list
          - gitlab_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
        fail_msg: >-
          A service restarted while it was supposedly up, so `active` was hiding a crash loop.
          Before:
          {% for unit, restarts in gitlab_verify_units | zip(gitlab_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
          after:
          {% for unit, restarts in gitlab_verify_units | zip(gitlab_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
        success_msg: >-
          None of the services restarted over 45 seconds of watching (restarts so far:
          {% for unit, restarts in gitlab_verify_units | zip(gitlab_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

- name: Show the GitLab verification summary
  ansible.builtin.debug:
    msg:
      - "GitLab systemd: {% for unit, state in gitlab_verify_units | zip(gitlab_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
      - "GitLab version: {{ gitlab_version.json.version }} (enterprise: {{ gitlab_version.json.enterprise }})"
      - "GitLab unauthenticated API request: HTTP {{ gitlab_version_anonymous.status }}"
      - "GitLab sign-in with a wrong password: HTTP {{ gitlab_sign_in_wrong.status }}"
      - "GitLab sign-in with the configured credentials: HTTP {{ gitlab_sign_in.status }}"
      - "GitLab services: {{ gitlab_ctl_status.stdout_lines | map('regex_replace', '^(\\w+: [\\w-]+):.*$', '\\1') | list }}"
      - "GitLab SSH: {{ ('greets on port ' ~ gitlab_container_ssh_host_bind_port) if gitlab_verify_ssh_expected | bool else 'not running (its port is not published)' }}"
      - "GitLab backup: {{ gitlab_backup_files.files | map(attribute='path') | map('basename') | list }}"
      - "GitLab batched background migrations (by status): {{ gitlab_background_migrations_status.stdout_lines | select('match', '^[a-z_]+ +[|] ') | map('regex_replace', '^([a-z_]+) .*$', '\\1') | list }}"

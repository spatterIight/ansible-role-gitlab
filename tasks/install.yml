---
- name: Ensure GitLab base path exists
  ansible.builtin.file:
    path: "{{ gitlab_base_path }}"
    state: directory
    mode: "0750"
    owner: "{{ gitlab_uid }}"
    group: "{{ gitlab_gid }}"

# GitLab manages the contents of these directories itself. The ownership and modes below are the ones
# GitLab sets on them, so that this role and GitLab do not keep changing them back and forth.
- name: Ensure GitLab data paths exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: root
    group: root
  with_items:
    - { path: "{{ gitlab_config_path }}", mode: "0775" }
    - { path: "{{ gitlab_logs_path }}", mode: "0755" }
    - { path: "{{ gitlab_data_path }}", mode: "0755" }

- name: Ensure GitLab container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ gitlab_container_image }}"
    pull: always
  register: gitlab_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: gitlab_container_image_pull_result_ansible_module is not failed

- name: Ensure GitLab container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ gitlab_container_image }}"
  register: gitlab_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: gitlab_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in gitlab_container_image_pull_result_command.stdout"

# GitLab refuses to start if it cannot be upgraded directly from the version it ran before (e.g. when a required
# upgrade stop was skipped), and would then stay down, restarting over and over.
#
# The same check runs here, with the new container image's own tool, before anything on the host points to that image
# (including the configuration, which the old container would apply on its next restart). This way, the playbook run
# fails with an explanation, and GitLab stays up.
- name: Check whether GitLab can be upgraded to the configured version
  when: gitlab_upgrade_check_enabled | bool
  block:
    - name: Check for the version file of an existing GitLab installation
      ansible.builtin.stat:
        path: "{{ gitlab_data_path }}/gitlab-rails/VERSION"
      register: gitlab_installed_version_file_stat

    - name: Read the version file of the existing GitLab installation
      when: gitlab_installed_version_file_stat.stat.exists
      ansible.builtin.slurp:
        src: "{{ gitlab_data_path }}/gitlab-rails/VERSION"
      register: gitlab_installed_version_file

    # The file contains the version GitLab ran when it was last started,
    # with an `-ee` suffix for the Enterprise Edition (e.g. `19.4.1-ee`).
    - name: Determine the version of the existing GitLab installation
      ansible.builtin.set_fact:
        gitlab_installed_version_full: "{{ (gitlab_installed_version_file.content | b64decode | trim) if gitlab_installed_version_file_stat.stat.exists else '' }}"

    - name: Determine the version number of the existing GitLab installation
      ansible.builtin.set_fact:
        gitlab_installed_version: >-
          {{ gitlab_installed_version_full | regex_search('^[0-9]+\.[0-9]+\.[0-9]+') or '' }}

    - name: Fail if GitLab would be downgraded
      ansible.builtin.fail:
        msg: >-
          GitLab {{ gitlab_installed_version }} is installed, but gitlab_version is set to {{ gitlab_version }}.
          Downgrading GitLab is not supported.
      when: "gitlab_installed_version != '' and gitlab_installed_version is version(gitlab_version | string, '>')"

    # The Community Edition cannot read everything the Enterprise Edition may have stored (e.g. EE-only integrations),
    # so GitLab needs to be prepared for it by hand first.
    - name: Fail if GitLab would be switched from the Enterprise Edition to the Community Edition
      ansible.builtin.fail:
        msg: >-
          GitLab {{ gitlab_installed_version_full }} (Enterprise Edition) is installed, but gitlab_edition is set to `ce`.
          Switching to the Community Edition needs manual preparation first,
          see https://docs.gitlab.com/update/convert_to_ee/revert/ for details.
          Once that is done, set gitlab_upgrade_check_enabled to `false` for the one run which switches the edition.
      when: "gitlab_edition == 'ce' and gitlab_installed_version_full is search('-ee$')"

    - name: Check whether GitLab can be upgraded directly from the existing installation
      when: "gitlab_installed_version != '' and gitlab_installed_version is version(gitlab_version | string, '<')"
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} run
          --rm
          --network=none
          {{ gitlab_container_image }}
          /opt/gitlab/bin/gitlab-ctl upgrade-check {{ gitlab_installed_version }} {{ gitlab_version }}
      register: gitlab_upgrade_check_result
      changed_when: false
      failed_when: false

    - name: Fail if GitLab cannot be upgraded directly from the existing installation
      ansible.builtin.fail:
        msg: >-
          GitLab cannot be upgraded directly from {{ gitlab_installed_version }} (the installed version) to {{ gitlab_version }}.
          Upgrade to the required upgrade stop(s) in between first, by setting gitlab_version to each of them in turn
          (and removing that setting again once you have caught up).
          See https://docs.gitlab.com/update/upgrade_paths/ for details.
          GitLab says: {{ (gitlab_upgrade_check_result.stderr_lines + gitlab_upgrade_check_result.stdout_lines) | join(' ') }}
      when: "gitlab_upgrade_check_result.rc | default(0) != 0"

    # The database migrations of a new minor or major version may depend on unfinished batched background migrations.
    # They would then fail on start, and GitLab would stay down, restarting over and over.
    - name: Check whether GitLab's batched background migrations have finished
      when:
        - gitlab_upgrade_check_background_migrations_enabled | bool
        - gitlab_installed_version != ''
        - gitlab_installed_version.split('.')[0:2] != (gitlab_version | string).split('.')[0:2]
      block:
        - name: Check whether the GitLab container is running
          ansible.builtin.command:
            cmd: "{{ devture_systemd_docker_base_host_command_docker }} container inspect {{ gitlab_identifier }}"
          register: gitlab_container_inspect_result
          changed_when: false
          failed_when: false

        # Prints a `Database: <name>` line per database, followed by a `<status> | <migration>` line per migration.
        - name: Retrieve the status of GitLab's batched background migrations
          when: "gitlab_container_inspect_result.rc == 0 and (gitlab_container_inspect_result.stdout | from_json | first).State.Running"
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} exec
              {{ gitlab_identifier }}
              /opt/gitlab/bin/gitlab-rake gitlab:background_migrations:status
          register: gitlab_background_migrations_status_result
          changed_when: false
          failed_when: false

        - name: Fail if the status of GitLab's batched background migrations could not be retrieved
          ansible.builtin.fail:
            msg: >-
              The status of GitLab's batched background migrations could not be retrieved, so it's unknown whether
              GitLab can be upgraded to {{ gitlab_version }} yet. Make sure that GitLab is up and working,
              or set gitlab_upgrade_check_background_migrations_enabled to `false` to skip this check.
              GitLab says: {{ (gitlab_background_migrations_status_result.stderr_lines + gitlab_background_migrations_status_result.stdout_lines) | join(' ') }}
          # Without the `Database: main` line, the output is not in the format this role understands.
          when: >-
            gitlab_background_migrations_status_result is not skipped
            and (gitlab_background_migrations_status_result.rc != 0 or 'Database: main' not in gitlab_background_migrations_status_result.stdout_lines)

        - name: Determine GitLab's unfinished batched background migrations
          when: gitlab_background_migrations_status_result is not skipped
          ansible.builtin.set_fact:
            gitlab_background_migrations_unfinished: >-
              {{
                gitlab_background_migrations_status_result.stdout_lines
                | select('match', '^[a-z_]+ +[|] ')
                | reject('match', '^(finished|finalized) ')
                | list
              }}

        - name: Fail if GitLab has unfinished batched background migrations
          ansible.builtin.fail:
            msg: >-
              GitLab cannot be upgraded from {{ gitlab_installed_version }} to {{ gitlab_version }} yet,
              because some of its batched background migrations have not finished:
              {{ gitlab_background_migrations_unfinished | map('regex_replace', ' +[|] ', ': ') | join('; ') }}.
              Wait for them to finish (see Admin area > Monitoring > Background migrations), and try again.
              If any of them failed, see https://docs.gitlab.com/update/background_migrations/ for how to resolve that.
          when: "gitlab_background_migrations_status_result is not skipped and gitlab_background_migrations_unfinished | length > 0"

# This file contains secrets (e.g. the database password), so only `root` (which GitLab runs as) may read it.
- name: Ensure GitLab configuration installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/gitlab.rb.j2"
    dest: "{{ gitlab_config_path }}/gitlab.rb"
    mode: "0600"
    owner: root
    group: root
  register: gitlab_config_result

- name: Ensure GitLab support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ gitlab_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ gitlab_uid }}"
    group: "{{ gitlab_gid }}"
  with_items:
    - env
    - labels
  register: gitlab_support_files_result

- name: Ensure GitLab container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ gitlab_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: gitlab_network_creation_result

- name: Ensure GitLab container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ gitlab_container_network }}
  register: gitlab_network_creation_result
  changed_when: gitlab_network_creation_result.rc == 0
  failed_when: gitlab_network_creation_result.rc != 0 and 'already exists' not in gitlab_network_creation_result.stderr

- name: Ensure GitLab systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/gitlab.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ gitlab_identifier }}.service"
    mode: "0644"
  register: gitlab_systemd_service_result

# GitLab only applies changes to `gitlab.rb` when it's reconfigured, which its container does on every start.
- name: Determine whether GitLab needs a restart
  ansible.builtin.set_fact:
    gitlab_restart_necessary: >-
      {{
        gitlab_config_result.changed | default(false)
        or gitlab_support_files_result.changed | default(false)
        or gitlab_systemd_service_result.changed | default(false)
        or gitlab_container_image_pull_result_ansible_module.changed | default(false)
        or gitlab_container_image_pull_result_command.changed | default(false)
      }}
